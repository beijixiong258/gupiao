[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gupiaoyanjiu"
dynamic = ["version"]
description = "个人使用的 A 股分析诊断与统一选股工具"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "rich>=13.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tushare>=1.2.89",
    "akshare>=1.18.73",
    "mini-racer>=0.14.0",
    "fastmcp>=3.3.0,<4.0.0",
]

[project.scripts]
gpyj = "cli:main"
gpyj-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "agent"}
py-modules = ["cli", "mcp_server"]
include-package-data = false

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["agent"]
include = ["src", "src.*"]
exclude = ["tests", "tests.*", "*.tests", "*.tests.*"]
namespaces = false

[tool.setuptools.package-data]
"src" = ["lianghua_peizhi.json"]
"src.providers" = ["llm_providers.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["agent"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
